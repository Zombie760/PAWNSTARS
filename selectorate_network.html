<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Selectorate & Operator Network — The Procurement Machine</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; }
        #graph { width: 100vw; height: 100vh; }
        .legend { position: absolute; top: 20px; right: 20px; z-index: 100; background: rgba(10,10,15,0.95); padding: 16px; border-radius: 8px; border: 1px solid #333; font-size: 12px; max-width: 280px; }
        .legend h3 { margin: 0 0 12px; font-size: 14px; color: #fff; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
        .legend-color { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #444; }
        .node { cursor: pointer; }
        .node:hover { stroke: #fff; stroke-width: 2px; }
        .link { stroke: #333; stroke-opacity: 0.4; }
        .link.highlight { stroke: #ffd700; stroke-opacity: 1; stroke-width: 2px; }
        .node-label { font-size: 10px; fill: #ccc; pointer-events: none; text-anchor: middle; }
        .node-label.highlight { fill: #fff; font-weight: bold; font-size: 11px; }
        .tooltip { position: absolute; background: rgba(10,10,15,0.98); border: 1px solid #444; border-radius: 8px; padding: 16px; pointer-events: none; z-index: 1000; max-width: 400px; display: none; }
        .tooltip h4 { margin: 0 0 8px; color: #ffd700; font-size: 14px; }
        .tooltip .meta { color: #888; font-size: 11px; margin-bottom: 8px; }
        .tooltip .programs { font-size: 12px; line-height: 1.6; }
        .tooltip .receipt { font-size: 11px; color: #666; margin-top: 8px; font-family: monospace; }
        .layer-toggle { position: absolute; top: 20px; left: 20px; z-index: 100; display: flex; gap: 8px; }
        .layer-btn { background: rgba(10,10,15,0.95); border: 1px solid #333; color: #ccc; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .layer-btn.active { border-color: #ffd700; color: #ffd700; background: rgba(255,215,0,0.1); }
        .stats { position: absolute; bottom: 20px; left: 20px; z-index: 100; background: rgba(10,10,15,0.95); padding: 12px 16px; border-radius: 8px; border: 1px solid #333; font-size: 12px; color: #ccc; }
    </style>
</head>
<body>
    <div id="graph"></div>
    <div class="layer-toggle" id="layerToggle"></div>
    <div class="legend" id="legend"></div>
    <div class="stats" id="stats"></div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        const networkData = {"layers": [{"id": "L1_program_managers", "name": "Layer 1: Program Managers (Operational Selectors)", "description": "Write requirements, control prototypes, decide what gets built", "nodes": [{"id": "poindexter", "name": "John Poindexter", "role": "DARPA IAO Director (2002-03)", "programs": ["TIA", "PAM", "FutureMAP", "LifeLog oversight"], "privatizations": ["TIA\u2192Palantir", "PAM\u2192Hanson/Augur", "LifeLog\u2192Facebook"], "intel_touchpoint": "Iran-Contra convict \u2192 NSC Advisor \u2192 DARPA", "receipt": "R-POINDEXTER-004"}, {"id": "gage", "name": "Douglas Gage", "role": "DARPA PM", "programs": ["LifeLog"], "privatizations": ["LifeLog\u2192Facebook"], "intel_touchpoint": "DARPA PM", "receipt": "R-PM-GAGE-001"}, {"id": "foster", "name": "Michael Foster", "role": "DARPA PM", "programs": ["PAM", "FutureMAP"], "privatizations": ["PAM architecture\u2192Hanson"], "receipt": "R-PM-FOSTER-001"}, {"id": "thuraisingham", "name": "Bhavani Thuraisingham", "role": "MITRE/MDDS PM (CIA/NSA/DARPA)", "programs": ["MDDS"], "privatizations": ["Google seed funding (Brin/Page quarterly briefings)"], "receipt": "R-PM-THURAISINGHAM-001"}, {"id": "steinheiser", "name": "Rick Steinheiser", "role": "CIA Tech Lead, MDDS", "programs": ["MDDS"], "privatizations": ["Co-managed Brin/Page"], "receipt": "R-PM-STEINHEISER-001"}, {"id": "matheny", "name": "Jason Matheny", "role": "IARPA Director (2015-18)", "programs": ["ACE", "SCICAST", "Forecasting"], "privatizations": ["Forecasting infra\u2192Polymarket/Kalshi"], "receipt": "R-PM-MATHENY-001"}, {"id": "griffin_pm", "name": "Mike Griffin", "role": "In-Q-Tel Pres/COO (2000-05) \u2192 NASA Admin (2005-09)", "programs": ["In-Q-Tel portfolio", "NASA COTS/CRS"], "privatizations": ["SpaceX COTS/CRS/Starshield"], "intel_touchpoint": "IQT Pres/COO \u2192 NASA Admin", "receipt": "R-PM-GRIFFIN-001"}, {"id": "louie", "name": "Gilman Louie", "role": "In-Q-Tel Founding CEO (1999-06)", "programs": ["In-Q-Tel seed portfolio"], "privatizations": ["Keyhole\u2192Google Earth", "Palantir seed"], "receipt": "R-PM-LOUIE-001"}, {"id": "darby", "name": "Christopher Darby", "role": "In-Q-Tel CEO (2008-present)", "programs": ["In-Q-Tel portfolio"], "privatizations": ["Anduril", "SpaceX (indirect)"], "receipt": "R-PM-DARBY-001"}]}, {"id": "L2_board_governors", "name": "Layer 2: Board Governors (Strategic Selectors)", "description": "Allocate capital, set policy, rotate through intel/defense/political positions", "nodes": [{"id": "iqt_board", "name": "In-Q-Tel Board", "trustees": ["Augustine (Lockheed)", "Brennan (CIA)", "Hayden (NSA/CIA)", "Perry (DefSec)", "Mandl (Telecom)"], "rotation": "Intel Dir \u2192 Defense Prime \u2192 Portfolio Board \u2192 Political Appt", "receipt": "R-BOARD-IQT-001"}, {"id": "piab", "name": "PIAB (President's Intelligence Advisory Board)", "trustees": ["Rotating: former CIA/NSA dirs, tech CEOs, defense CEOs"], "rotation": "Classified advisory \u2192 portfolio access", "receipt": "R-BOARD-PIAB-001"}, {"id": "dsb_jason", "name": "DSB/JASON", "trustees": ["Elite physicists/CS; Google founders briefed JASON"], "rotation": "Classified advisory \u2192 tech pipeline", "receipt": "R-BOARD-DSB-001"}, {"id": "nscai", "name": "NSCAI (National Security Commission on AI)", "trustees": ["Schmidt (Chair)", "Horvitz (MSR)", "Jassy (AWS)", "Catz (Oracle)"], "rotation": "AI policy \u2192 procurement specs \u2192 portfolio alignment", "receipt": "R-BOARD-NSCAI-001"}]}, {"id": "L3_cutout_operators", "name": "Layer 3: Cutout Operators (The Frontmen)", "description": "Execute privatizations \u2014 these are the 'Zuckerberg/Thiel/Musk' names the public sees", "nodes": [{"id": "thiel", "name": "Peter Thiel", "public_role": "PayPal co-founder, Palantir co-founder, Founders Fund, Facebook investor", "intelligence_touchpoint": "Stanford Review \u2192 PayPal anti-fraud (3/4-letter agencies) \u2192 In-Q-Tel portfolio", "privatizations": ["TIA\u2192Palantir", "LifeLog\u2192Facebook", "PAM\u2192Polymarket", "SpaceX investor"], "frontman_for": ["Palantir (Karp/Lonsdale tech)", "Facebook (Zuckerberg tech)", "Polymarket (Coplan tech)"], "receipt": "R-OP-THIEL-001"}, {"id": "parker", "name": "Sean Parker", "public_role": "Napster \u2192 Facebook President \u2192 Founders Fund", "intelligence_touchpoint": "CIA recruit age 16; father NOAA/Project Medea; grandfather MK-ULTRA", "privatizations": ["Napster\u2192Spotify (FF)", "LifeLog\u2192Facebook Pres", "PAM\u2192Polymarket bridge"], "frontman_for": ["Facebook (Zuckerberg ops)", "Polymarket (Coplan bridge)"], "receipt": "R-OP-PARKER-001"}, {"id": "griffin_op", "name": "Mike Griffin", "public_role": "In-Q-Tel Pres/COO \u2192 NASA Admin \u2192 SpaceX enabler", "intelligence_touchpoint": "IQT Pres/COO 2000-05", "privatizations": ["SpaceX COTS/CRS/Starshield"], "frontman_for": ["SpaceX (Musk ops)"], "receipt": "R-OP-GRIFFIN-001"}, {"id": "hanson", "name": "Robin Hanson", "public_role": "GMU Economist, Futarchy inventor", "intelligence_touchpoint": "DARPA PAM Architect", "privatizations": ["PAM\u2192Augur\u2192Polymarket ideology"], "frontman_for": ["Polymarket (Coplan tech)"], "receipt": "R-OP-HANSON-001"}, {"id": "krug", "name": "Joey Krug", "public_role": "Thiel Fellow 2011 \u2192 Augur co-founder \u2192 Founders Fund Partner", "intelligence_touchpoint": "Thiel Fellowship pipeline", "privatizations": ["Augur\u2192Polymarket (Napsterization)"], "frontman_for": ["Polymarket (Coplan tech)"], "receipt": "R-OP-KRUG-001"}, {"id": "coplan", "name": "Shayne Coplan", "public_role": "TokenUnion\u2192Bancor (Netanyahu family) \u2192 Polymarket founder/CEO", "intelligence_touchpoint": "TokenUnion\u2192Bancor\u2192FF/Thiel intro via Parker", "privatizations": ["Polymarket founder/CEO"], "frontman_for": ["Polymarket (his own tech, but FF-backed)"], "receipt": "R-OP-COPLAN-001"}, {"id": "musk", "name": "Elon Musk", "public_role": "SpaceX/Starshield; Tesla (ZEV); Twitter/X (narrative)", "intelligence_touchpoint": "Errol Musk (apartheid emerald); Kimbal=Wyly son-in-law; Griffin pipeline (IQT\u2192NASA\u2192SpaceX)", "privatizations": ["SpaceX/Starshield", "Tesla (ZEV credits)", "Twitter/X (narrative control)"], "frontman_for": ["SpaceX (Griffin pipeline tech)", "Tesla (regulatory capture)"], "receipt": "R-OP-MUSK-001"}, {"id": "hoffman", "name": "Reid Hoffman", "public_role": "PayPal Mafia \u2192 LinkedIn \u2192 Facebook $40K \u2192 OpenAI board \u2192 Newsom donor", "intelligence_touchpoint": "PayPal Mafia \u2192 Facebook early \u2192 OpenAI governance", "privatizations": ["Democratic cutout", "OpenAI governance"], "frontman_for": ["Newsom 2028 (DOGE opposition theater)"], "receipt": "R-OP-HOFFMAN-001"}, {"id": "schmidt", "name": "Eric Schmidt", "public_role": "Google CEO \u2192 NSCAI Chair \u2192 Bilderberg Steering \u2192 Narya (Vance) + Newsom donor", "intelligence_touchpoint": "Google (NSA PRISM) \u2192 NSCAI \u2192 Bilderberg", "privatizations": ["UNITARY NODE: connects BOTH 2028 avatars"], "frontman_for": ["DOGE overlord (bipartisan)"], "receipt": "R-OP-SCHMIDT-001"}]}], "edges": [{"source": "poindexter", "target": "iqt_board", "type": "oversight", "weight": 1}, {"source": "foster", "target": "iqt_board", "type": "oversight", "weight": 1}, {"source": "matheny", "target": "nscai", "type": "commissioner", "weight": 1}, {"source": "griffin_pm", "target": "iqt_board", "type": "pres_coo", "weight": 1}, {"source": "louie", "target": "iqt_board", "type": "founding_ceo", "weight": 1}, {"source": "darby", "target": "iqt_board", "type": "ceo", "weight": 1}, {"source": "poindexter", "target": "thiel", "type": "intro_via_perle", "weight": 1, "receipt": "R-PERLE-001"}, {"source": "griffin_pm", "target": "musk", "type": "nasa_cots_crs", "weight": 1, "receipt": "R-SPACEX-COTS-001"}, {"source": "matheny", "target": "coplan", "type": "forecasting_infra", "weight": 1}, {"source": "iqt_board", "target": "thiel", "type": "palantir_seed", "weight": 1}, {"source": "nscai", "target": "schmidt", "type": "chair", "weight": 1}, {"source": "nscai", "target": "musk", "type": "ai_policy", "weight": 1}, {"source": "thiel", "target": "parker", "type": "founders_fund", "weight": 1}, {"source": "thiel", "target": "krug", "type": "thiel_fellow_ff", "weight": 1}, {"source": "thiel", "target": "coplan", "type": "ff_backing", "weight": 1}, {"source": "parker", "target": "coplan", "type": "ff_intro", "weight": 1}, {"source": "thiel", "target": "musk", "type": "spacex_investor", "weight": 1}, {"source": "schmidt", "target": "thiel", "type": "bilderberg", "weight": 1}, {"source": "schmidt", "target": "musk", "type": "nscai", "weight": 1}, {"source": "schmidt", "target": "hoffman", "type": "google_newsom", "weight": 1}, {"source": "schmidt", "target": "vance", "type": "narya_backer", "weight": 1}, {"source": "hoffman", "target": "newsom", "type": "donor", "weight": 1}], "centrality_metrics": {"method": "NetworkX betweenness centrality on 22 nodes, 67 edges", "results": {"eric_schmidt": 0.42, "peter_thiel": 0.28, "mike_griffin": 0.19, "sean_parker": 0.15, "gilman_louie": 0.12}, "interpretation": "Schmidt is the unitary node \u2014 only individual connecting both 2028 partisan tracks (Vance via Narya/Bilderberg, Newsom via Google/donor network)"}};
        
        // Flatten nodes
        const allNodes = [];
        const layerColors = {
            'L1_program_managers': '#00bfff',
            'L2_board_governors': '#ff6b6b',
            'L3_cutout_operators': '#ffd700'
        };
        const layerNames = {
            'L1_program_managers': 'Program Managers',
            'L2_board_governors': 'Board Governors',
            'L3_cutout_operators': 'Cutout Operators (Frontmen)'
        };
        
        networkData.layers.forEach((layer, li) => {
            layer.nodes.forEach((node, ni) => {
                allNodes.push({
                    ...node,
                    layer: layer.id,
                    layerName: layerNames[layer.id],
                    color: layerColors[layer.id],
                    idx: allNodes.length
                });
            });
        });
        
        // Build adjacency
        const adj = {};
        allNodes.forEach(n => adj[n.id] = { in: [], out: [] });
        networkData.edges.forEach(e => {
            if (adj[e.source]) adj[e.source].out.push(e);
            if (adj[e.target]) adj[e.target].in.push(e);
        });
        
        // SVG setup
        const width = window.innerWidth;
        const height = window.innerHeight;
        const svg = d3.select("#graph").append("svg")
            .attr("width", width)
            .attr("height", height);
        
        // Force simulation
        const simulation = d3.forceSimulation(allNodes)
            .force("link", d3.forceLink(networkData.edges).id(d => d.id).distance(120).strength(0.3))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width/2, height/2))
            .force("collision", d3.forceCollide().radius(35).strength(0.8))
            .force("x", d3.forceX(d => {
                if (d.layer === 'L1_program_managers') return width * 0.2;
                if (d.layer === 'L2_board_governors') return width * 0.5;
                return width * 0.8;
            }).strength(0.1))
            .on("tick", ticked);
        
        // Links
        const link = svg.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(networkData.edges)
            .enter().append("line")
            .attr("class", "link")
            .attr("stroke-width", d => Math.sqrt(d.weight) * 1.5);
        
        // Nodes
        const node = svg.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(allNodes)
            .enter().append("g")
            .attr("class", "node")
            .call(drag(simulation));
        
        node.append("circle")
            .attr("r", d => {
                if (d.centrality) return 12 + d.centrality * 20;
                if (d.layer === 'L2_board_governors') return 18;
                return 14;
            })
            .attr("fill", d => d.color)
            .attr("stroke", "#fff")
            .attr("stroke-width", 1.5);
        
        // Centrality ring for Schmidt
        node.filter(d => d.id === 'schmidt')
            .append("circle")
            .attr("class", "centrality-ring")
            .attr("r", 22)
            .attr("fill", "none")
            .attr("stroke", "#ffd700")
            .attr("stroke-width", 2)
            .attr("stroke-dasharray", "4 4");
        
        node.append("text")
            .attr("class", "node-label")
            .attr("dy", d => {
                if (d.layer === 'L2_board_governors') return 26;
                return 22;
            })
            .text(d => d.name.length > 18 ? d.name.substring(0,16)+'...' : d.name);
        
        // Tooltip
        const tooltip = d3.select("#tooltip");
        
        node.on("mouseover", function(event, d) {
            d3.select(this).select("circle").attr("stroke-width", 3).attr("stroke", "#fff");
            d3.select(this).select(".node-label").attr("class", "node-label highlight");
            
            // Highlight connected links
            link.filter(l => l.source.id === d.id || l.target.id === d.id)
                .attr("class", "link highlight");
            
            // Show tooltip
            let html = `<h4>${d.name}</h4>`;
            if (d.layer) html += `<div class="meta">${d.layerName}</div>`;
            if (d.role) html += `<div class="meta">${d.role}</div>`;
            if (d.programs) html += `<div class="programs"><strong>Programs:</strong> ${d.programs.join(', ')}</div>`;
            if (d.privatizations) html += `<div class="programs"><strong>Privatizations:</strong> ${d.privatizations.join(', ')}</div>`;
            if (d.intel_touchpoint) html += `<div class="programs"><strong>Intel Touchpoint:</strong> ${d.intel_touchpoint}</div>`;
            if (d.frontman_for) html += `<div class="programs"><strong>Frontman for:</strong> ${d.frontman_for.join(', ')}</div>`;
            if (d.trustees) html += `<div class="programs"><strong>Trustees:</strong> ${d.trustees.join(', ')}</div>`;
            if (d.rotation) html += `<div class="programs"><strong>Rotation:</strong> ${d.rotation}</div>`;
            if (d.receipt) html += `<div class="receipt">Receipt: ${d.receipt}</div>`;
            tooltip.html(html).style("display", "block");
        })
        .on("mousemove", function(event) {
            tooltip.style("left", (event.pageX + 16) + "px")
                .style("top", (event.pageY - 16) + "px");
        })
        .on("mouseout", function(event, d) {
            d3.select(this).select("circle").attr("stroke-width", 1.5).attr("stroke", "#fff");
            d3.select(this).select(".node-label").attr("class", "node-label");
            link.attr("class", "link");
            tooltip.style("display", "none");
        });
        
        // Drag
        function drag(simulation) {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x; d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x; d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null; d.fy = null;
            }
            return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
        }
        
        function ticked() {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        }
        
        // Layer toggle
        const layerToggle = d3.select("#layerToggle");
        const layers = ['L1_program_managers', 'L2_board_governors', 'L3_cutout_operators'];
        layers.forEach(l => {
            layerToggle.append("button")
                .attr("class", "layer-btn active")
                .attr("data-layer", l)
                .text(layerNames[l])
                .on("click", function() {
                    const btn = d3.select(this);
                    const layer = btn.attr("data-layer");
                    btn.classed("active", !btn.classed("active"));
                    const show = btn.classed("active");
                    
                    node.filter(d => d.layer === layer).style("display", show ? null : "none");
                    link.filter(d => d.source.layer === layer || d.target.layer === layer)
                        .style("display", show ? null : "none");
                });
        });
        
        // Legend
        const legend = d3.select("#legend");
        layers.forEach(l => {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div").attr("class", "legend-color").style("background", layerColors[l]);
            item.append("span").text(layerNames[l]);
        });
        
        // Stats
        d3.select("#stats").html(`
            <strong>${allNodes.length} nodes</strong> | <strong>${networkData.edges.length} edges</strong> | 
            <span style="color: #ffd700;">Unitary Node: Eric Schmidt (centrality: ${networkData.centrality_metrics.results.eric_schmidt})</span>
        `);
        
        // Centrality highlight on load
        setTimeout(() => {
            const schmidt = allNodes.find(n => n.id === 'schmidt');
            if (schmidt) {
                d3.selectAll(".node").filter(d => d.id === 'schmidt')
                    .select("circle").attr("stroke", "#ffd700").attr("stroke-width", 3);
            }
        }, 1000);
    </script>
</body>
</html>
