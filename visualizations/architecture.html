<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Three-Layer Architecture — The Procurement Machine</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.5rem; background: linear-gradient(135deg, #fff, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 8px; }
        .subtitle { color: #888; margin-bottom: 32px; }
        .arch-diagram { display: flex; flex-direction: column; gap: 40px; align-items: center; }
        .layer { width: 100%; max-width: 1200px; background: rgba(255,255,255,0.02); border: 1px solid #222; border-radius: 12px; padding: 24px; position: relative; }
        .layer-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #333; }
        .layer-color { width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .layer-title { font-size: 1.3rem; font-weight: 600; }
        .layer-desc { color: #888; font-size: 0.95rem; margin-left: 64px; }
        .nodes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .node-card { background: rgba(255,255,255,0.03); border: 1px solid #222; border-radius: 8px; padding: 20px; transition: all 0.2s; }
        .node-card:hover { border-color: currentColor; transform: translateY(-2px); box-shadow: 0 8px 30px -10px currentColor; }
        .node-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
        .node-detail { color: #aaa; font-size: 0.9rem; line-height: 1.6; margin: 12px 0; }
        .node-receipts { font-size: 0.75rem; color: #666; font-family: monospace; }
        .flows-section { margin-top: 40px; }
        .flow { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 16px 0; padding: 16px; background: rgba(255,215,0,0.05); border: 1px solid #ffd700; border-radius: 8px; }
        .flow-arrow { font-size: 24px; color: #ffd700; }
        .flow-text { text-align: center; color: #ccc; }
        .flow-text strong { color: #ffd700; }
    
        @media (max-width: 768px) {
            .container { padding: 16px 12px; }
            header { padding: 20px 0 16px; }
            h1 { font-size: 1.8rem !important; }
            .subtitle { font-size: 1rem !important; }
            .controls { flex-direction: column; align-items: stretch; }
            .filter-btn, .btn { width: 100%; text-align: center; }
            .legend { position: static; margin: 20px 0; max-width: 100%; }
            .stats { position: static; margin-top: 20px; text-align: center; }
            .stats-row { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
            .widget.full-width { grid-column: auto; }
            .widget-body iframe { height: 300px; }
            .card-grid { grid-template-columns: 1fr; }
            .stage-badge { min-width: 100%; }
            .pipeline-stages { flex-direction: column; }
            .controls { flex-direction: column; }
            .btn { width: 100%; }
            .layer-header { flex-direction: column; align-items: flex-start; }
            .nodes-grid { grid-template-columns: 1fr; }
            .flow { flex-direction: column; gap: 12px; }
            .legend { flex-direction: column; gap: 8px; }
            .filter-row { flex-direction: column; }
            .filter-btn { width: 100%; }
            .event-card { max-width: 100%; }
            .event-date { width: 80px; font-size: 11px; padding-right: 8px; }
            .event-dot { left: 90px; }
            .event-card { padding: 12px 14px; }
            .event-header { flex-wrap: wrap; }
            .stat-card { padding: 16px; }
            .stat-card .value { font-size: 1.5rem; }
            .quick-links { flex-direction: column; }
            .quick-link { text-align: center; }
            .card-grid { grid-template-columns: 1fr; }
            .stage-badge { min-width: 100%; }
            .filter-row { flex-direction: column; }
        }
        @media (max-width: 480px) {
            .container { padding: 12px 8px; }
            h1 { font-size: 1.5rem !important; }
            h2 { font-size: 1.3rem !important; }
            h3 { font-size: 1.1rem !important; }
            .widget-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .widget-header h3 { font-size: 1rem; }
            .btn { padding: 12px 16px; font-size: 0.9rem; }
            .stat-card { padding: 12px; }
            .stat-card .value { font-size: 1.3rem; }
            .widget-body { padding: 12px; }
        }

</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Three-Layer Architecture</h1>
            <p class="subtitle">The structural framework of intelligence program privatization</p>
        </header>
        
        <div class="arch-diagram" id="archDiagram"></div>
        
        <div class="flows-section">
            <h2 style="color: #ffd700; text-align: center; margin-bottom: 24px;">System Flows</h2>
            <div id="flows"></div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        const data = {"layers": [{"id": "intelligence_community", "name": "INTELLIGENCE COMMUNITY\n(Selectorate)", "description": "Who decides what gets built and privatized", "color": "#1a1a2e", "nodes": [{"id": "program_managers", "label": "9 Program Managers", "detail": "Poindexter, Gage, Foster, Thuraisingham, Steinheiser, Matheny, Griffin, Louie, Darby", "receipts": ["R-PM-POINDEXTER-001", "R-PM-GAGE-001", "R-PM-FOSTER-001"]}, {"id": "board_governors", "label": "4 Board Bodies", "detail": "In-Q-Tel Board, PIAB, DSB/JASON, NSCAI", "receipts": ["R-BOARD-IQT-001", "R-BOARD-PIAB-001", "R-BOARD-DSB-001", "R-BOARD-NSCAI-001"]}, {"id": "in_q_tel", "label": "In-Q-Tel (CIA VC)", "detail": "The obligatory passage point - capital + personnel + IP bridge", "receipts": ["R-GRIFFIN-IQT-001", "R-PM-LOUIE-001", "R-PM-DARBY-001"]}]}, {"id": "pipeline_stages", "name": "5-STAGE PIPELINE\n(Procurement Template)", "description": "Repeatable stages with falsifiable gates", "color": "#16213e", "nodes": [{"id": "S1", "label": "S1: Public Program", "detail": "DARPA/IARPA/NSA prototypes surveillance/data-fusion/governance capability", "gates": ["Program charter", "PM assigned", "Budget line", "Surveillance scope"]}, {"id": "S2", "label": "S2: Congressional Defunding", "detail": "Political resistance creates policy vacuum", "gates": ["Defunding bill passed", "OR public cancellation", "OR 90+ day gap"]}, {"id": "S3", "label": "S3: Intelligence VC Bridge", "detail": "In-Q-Tel transfers capital/personnel/IP", "gates": ["IQT investment", "Personnel transfer", "IP transfer"]}, {"id": "S4", "label": "S4: Private Incorporation", "detail": "Same month, same architects, same codebase", "gates": ["Incorp <=30 days", "Same architects", "Architecture continuity"]}, {"id": "S5", "label": "S5: Regulatory Capture -> Futarchy", "detail": "Alumni installed as regulators; federal data -> prediction markets -> governance replacement", "gates": ["Alumni in regulatory roles", "Data centralized", "Prediction markets fed", "Governance aligned"]}]}, {"id": "cutout_operators", "name": "CUTOUT OPERATORS\n(The Frontmen)", "description": "Execute privatizations - public faces of the pipeline", "color": "#0f3460", "nodes": [{"id": "thiel", "label": "Peter Thiel", "fronts": ["Palantir (Karp/Lonsdale)", "Facebook (Zuckerberg)", "Polymarket (Coplan)", "SpaceX investor"], "receipt": "R-OP-THIEL-001"}, {"id": "parker", "label": "Sean Parker", "fronts": ["Facebook (Zuckerberg ops)", "Polymarket (Coplan bridge)"], "receipt": "R-OP-PARKER-001"}, {"id": "griffin_op", "label": "Mike Griffin", "fronts": ["SpaceX (Musk ops)"], "receipt": "R-OP-GRIFFIN-001"}, {"id": "hanson", "label": "Robin Hanson", "fronts": ["Polymarket (Coplan tech)"], "receipt": "R-OP-HANSON-001"}, {"id": "krug", "label": "Joey Krug", "fronts": ["Polymarket (Coplan tech)"], "receipt": "R-OP-KRUG-001"}, {"id": "coplan", "label": "Shayne Coplan", "fronts": ["Polymarket (FF-backed)"], "receipt": "R-OP-COPLAN-001"}, {"id": "musk", "label": "Elon Musk", "fronts": ["SpaceX (Griffin pipeline)", "Tesla (regulatory capture)"], "receipt": "R-OP-MUSK-001"}, {"id": "hoffman", "label": "Reid Hoffman", "fronts": ["Newsom 2028 (DOGE opposition theater)"], "receipt": "R-OP-HOFFMAN-001"}, {"id": "schmidt", "label": "Eric Schmidt", "fronts": ["DOGE overlord (bipartisan)"], "receipt": "R-OP-SCHMIDT-001"}]}], "flows": [{"from": "intelligence_community", "to": "pipeline_stages", "label": "Writes requirements -> Controls prototypes"}, {"from": "pipeline_stages", "to": "cutout_operators", "label": "Executes privatizations -> Becomes public face"}, {"from": "cutout_operators", "to": "intelligence_community", "label": "Returns as CIOs/Regulators -> Closes loop"}]};
        
        const container = document.getElementById('archDiagram');
        
        data.layers.forEach(layer => {
            const layerEl = document.createElement('div');
            layerEl.className = 'layer';
            layerEl.style.borderLeft = `4px solid ${layer.color}`;
            
            layerEl.innerHTML = `
                <div class="layer-header">
                    <div class="layer-color" style="background: ${layer.color}">${layer.id.charAt(0).toUpperCase()}</div>
                    <div>
                        <div class="layer-title">${layer.name}</div>
                        <div class="layer-desc">${layer.description}</div>
                    </div>
                </div>
                <div class="nodes-grid">
                    ${layer.nodes.map(node => `
                        <div class="node-card" style="border-left: 3px solid ${layer.color};">
                            <div class="node-title">${node.label}</div>
                            <div class="node-detail">${node.detail}</div>
                            ${node.receipts ? `<div class="node-receipts">Receipts: ${node.receipts.join(', ')}</div>` : ''}
                            ${node.gates ? `<div class="node-receipts">Gates: ${node.gates.join('; ')}</div>` : ''}
                            ${node.fronts ? `<div class="node-detail">Fronts: ${node.fronts.join(', ')}</div><div class="node-receipts">Receipt: ${node.receipt}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(layerEl);
        });
        
        const flowsContainer = document.getElementById('flows');
        data.flows.forEach(flow => {
            const flowEl = document.createElement('div');
            flowEl.className = 'flow';
            flowEl.innerHTML = `
                <span class="flow-text"><strong>${flow.from.replace(/_/g, ' ')}</strong></span>
                <span class="flow-arrow">→</span>
                <span class="flow-text"><strong>${flow.to.replace(/_/g, ' ')}</strong></span>
                <span class="flow-arrow">:</span>
                <span class="flow-text">${flow.label}</span>
            `;
            flowsContainer.appendChild(flowEl);
        });
    </script>
</body>
</html>
